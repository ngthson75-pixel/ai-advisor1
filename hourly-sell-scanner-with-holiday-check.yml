name: Hourly SELL Signal Scanner

on:
  schedule:
    # Chạy mỗi giờ từ 9 AM - 3 PM Vietnam time - CHỈ T2-T6
    # Vietnam time = UTC + 7
    # 9 AM VN = 2 AM UTC
    # 3 PM VN = 8 AM UTC
    - cron: '0 2-8 * * 1-5'   # Mỗi giờ từ 2-8 AM UTC (9 AM - 3 PM VN), T2-T6
  
  workflow_dispatch:  # Manual trigger

jobs:
  scan-sell-signals:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests vnstock --break-system-packages
      
      - name: Check if trading day
        id: check_trading_day
        run: |
          echo "🗓️ Checking if today is a trading day..."
          
          # Download holiday calendar
          curl -s https://raw.githubusercontent.com/${{ github.repository }}/main/vietnam_holidays.json > vietnam_holidays.json || echo '{"holidays":{}}' > vietnam_holidays.json
          
          # Download check script
          curl -s https://raw.githubusercontent.com/${{ github.repository }}/main/check_trading_day.py > check_trading_day.py
          
          # Run check
          if python check_trading_day.py --quiet; then
            echo "trading_day=true" >> $GITHUB_OUTPUT
            echo "✅ Today is a trading day - Proceeding with scan"
          else
            echo "trading_day=false" >> $GITHUB_OUTPUT
            echo "❌ Today is NOT a trading day - Skipping scan"
            exit 0  # Exit gracefully
          fi
      
      - name: Check if during trading hours
        if: steps.check_trading_day.outputs.trading_day == 'true'
        id: check_trading_hours
        run: |
          echo "⏰ Checking trading hours..."
          
          # Get current Vietnam time (UTC+7)
          VN_HOUR=$(TZ='Asia/Ho_Chi_Minh' date +%H)
          VN_MINUTE=$(TZ='Asia/Ho_Chi_Minh' date +%M)
          VN_TIME="${VN_HOUR}:${VN_MINUTE}"
          
          echo "Current Vietnam time: $VN_TIME"
          
          # Trading hours: 9:00-11:30, 13:00-15:00
          if [ $VN_HOUR -ge 9 -a $VN_HOUR -lt 12 ] || [ $VN_HOUR -ge 13 -a $VN_HOUR -lt 15 ]; then
            echo "trading_hours=true" >> $GITHUB_OUTPUT
            echo "✅ Within trading hours"
          else
            echo "trading_hours=false" >> $GITHUB_OUTPUT
            echo "⏸️ Outside trading hours - Skipping scan"
            exit 0  # Exit gracefully
          fi
      
      - name: Wake backend (if sleeping)
        if: steps.check_trading_day.outputs.trading_day == 'true' && steps.check_trading_hours.outputs.trading_hours == 'true'
        run: |
          echo "⏰ Waking up backend..."
          curl -f https://ai-advisor1-backend.onrender.com/api/health || true
          sleep 5
      
      - name: Check backend health
        if: steps.check_trading_day.outputs.trading_day == 'true' && steps.check_trading_hours.outputs.trading_hours == 'true'
        run: |
          echo "🏥 Checking backend health..."
          for i in {1..3}; do
            if curl -f https://ai-advisor1-backend.onrender.com/api/health; then
              echo "✅ Backend is healthy"
              exit 0
            fi
            echo "⚠️ Attempt $i failed, retrying..."
            sleep 10
          done
          echo "❌ Backend health check failed"
          exit 1
      
      - name: Get current SELL signal count
        if: steps.check_trading_day.outputs.trading_day == 'true' && steps.check_trading_hours.outputs.trading_hours == 'true'
        id: before_scan
        run: |
          echo "📊 Getting SELL signal count..."
          COUNT=$(curl -s "https://ai-advisor1-backend.onrender.com/api/signals?action=SELL" | jq -r '.count // 0')
          echo "current_count=$COUNT" >> $GITHUB_OUTPUT
          echo "Current SELL signals: $COUNT"
      
      - name: Run SELL signal scanner
        if: steps.check_trading_day.outputs.trading_day == 'true' && steps.check_trading_hours.outputs.trading_hours == 'true'
        run: |
          echo "🔍 Starting SELL signal scanner..."
          
          # Call backend SELL scan endpoint
          RESPONSE=$(curl -X POST https://ai-advisor1-backend.onrender.com/api/scan-sell \
            -H "Content-Type: application/json" \
            -w "\n%{http_code}" \
            -s)
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"
          
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ SELL scan completed successfully"
            echo "$BODY" | jq '.' || echo "$BODY"
          else
            echo "❌ SELL scan failed with status $HTTP_CODE"
            exit 1
          fi
      
      - name: Get final SELL signal count
        if: steps.check_trading_day.outputs.trading_day == 'true' && steps.check_trading_hours.outputs.trading_hours == 'true'
        id: after_scan
        run: |
          echo "📊 Getting final SELL signal count..."
          sleep 3
          COUNT=$(curl -s "https://ai-advisor1-backend.onrender.com/api/signals?action=SELL" | jq -r '.count // 0')
          echo "final_count=$COUNT" >> $GITHUB_OUTPUT
          echo "Final SELL signals: $COUNT"
      
      - name: Calculate new SELL signals
        if: steps.check_trading_day.outputs.trading_day == 'true' && steps.check_trading_hours.outputs.trading_hours == 'true'
        run: |
          BEFORE=${{ steps.before_scan.outputs.current_count }}
          AFTER=${{ steps.after_scan.outputs.final_count }}
          NEW=$((AFTER - BEFORE))
          
          echo "=================================="
          echo "📊 SELL SCAN RESULTS"
          echo "=================================="
          echo "Before: $BEFORE SELL signals"
          echo "After:  $AFTER SELL signals"
          echo "New:    $NEW SELL signals"
          echo "=================================="
      
      - name: Notify on failure
        if: failure() && steps.check_trading_day.outputs.trading_day == 'true'
        run: |
          echo "❌ Hourly SELL scan failed!"
          echo "Check logs for details"
