name: CI/CD Pipeline

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

env:
  PYTHON_VERSION: '3.10'
  NODE_VERSION: '18'

jobs:
  # ============================================================
  # JOB 1: BACKEND TESTS
  # ============================================================
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: aiadvisor
          POSTGRES_PASSWORD: test123
          POSTGRES_DB: aiadvisor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --break-system-packages
          pip install pytest pytest-cov pytest-flask --break-system-packages
      
      - name: Run backend tests
        env:
          DATABASE_URL: postgresql://aiadvisor:test123@localhost:5432/aiadvisor_test
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FLASK_ENV: testing
        run: |
          pytest tests/ -v \
            --cov=. \
            --cov-report=xml \
            --cov-report=term-missing \
            -m "not slow"
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: backend
          name: backend-coverage
        continue-on-error: true
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            coverage.xml
            htmlcov/

  # ============================================================
  # JOB 2: FRONTEND TESTS
  # ============================================================
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Run tests
        working-directory: ./frontend
        run: npm run test -- --run --coverage
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          directory: ./frontend/coverage
          flags: frontend
          name: frontend-coverage
        continue-on-error: true
      
      - name: Build check
        working-directory: ./frontend
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 1

  # ============================================================
  # JOB 3: CODE QUALITY
  # ============================================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install linting tools
        run: |
          pip install black flake8 --break-system-packages
      
      - name: Check Python formatting (Black)
        run: black --check . || true
      
      - name: Lint Python (Flake8)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Lint Frontend (ESLint)
        working-directory: ./frontend
        run: |
          npm ci
          npm run lint || true
        continue-on-error: true

  # ============================================================
  # JOB 4: SECURITY SCAN
  # ============================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true
      
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  # ============================================================
  # JOB 5: DEPLOY STAGING (auto on push to staging branch)
  # ============================================================
  deploy-staging:
    name: Deploy to Staging
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to Render (Staging)
        run: |
          echo "🚀 Deploying to Render Staging..."
          curl -X POST "https://api.render.com/deploy/${{ secrets.RENDER_STAGING_HOOK }}"
      
      - name: Deploy to Cloudflare Pages (Staging)
        run: |
          echo "🚀 Deploying to Cloudflare Pages Staging..."
          # Cloudflare auto-deploys on git push
      
      - name: Wait for deployment
        run: sleep 60
      
      - name: Health check (Staging)
        run: |
          curl -f https://ai-advisor1-staging.onrender.com/health || exit 1
      
      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ Staging deployment successful!"
          echo "Backend: https://ai-advisor1-staging.onrender.com"
          echo "Frontend: https://staging.ai-advisor.vn"

  # ============================================================
  # JOB 6: DEPLOY PRODUCTION (manual approval required)
  # ============================================================
  deploy-production:
    name: Deploy to Production
    needs: [test-backend, test-frontend, code-quality]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://ai-advisor.vn
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to Render (Production)
        run: |
          echo "🚀 Deploying to Render Production..."
          curl -X POST "https://api.render.com/deploy/${{ secrets.RENDER_PRODUCTION_HOOK }}"
      
      - name: Deploy to Cloudflare Pages (Production)
        run: |
          echo "🚀 Deploying to Cloudflare Pages Production..."
          # Cloudflare auto-deploys on git push
      
      - name: Wait for deployment
        run: sleep 120
      
      - name: Health check (Production)
        run: |
          curl -f https://ai-advisor1-backend.onrender.com/health || exit 1
      
      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ Production deployment successful!"
          echo "Backend: https://ai-advisor1-backend.onrender.com"
          echo "Frontend: https://ai-advisor.vn"
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Production deployment failed!"
          echo "Check logs for details"

  # ============================================================
  # JOB 7: POST-DEPLOYMENT TESTS
  # ============================================================
  post-deploy-tests:
    name: Post-Deployment Tests
    needs: [deploy-production]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Test Production Endpoints
        run: |
          echo "🧪 Testing production endpoints..."
          
          # Health check
          curl -f https://ai-advisor1-backend.onrender.com/health
          
          # Signals endpoint
          curl -f https://ai-advisor1-backend.onrender.com/api/signals
          
          # Frontend loads
          curl -f https://ai-advisor.vn
      
      - name: Performance test
        run: |
          echo "⚡ Running performance test..."
          # Could add lighthouse CI here
      
      - name: Create deployment summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Backend: https://ai-advisor1-backend.onrender.com" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Frontend: https://ai-advisor.vn" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ All health checks passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed at:** $(date)" >> $GITHUB_STEP_SUMMARY
