name: Update EOD Prices

on:
  schedule:
    # Vietnam time (UTC+7) - Monday to Friday
    # 9:30 AM VN  = 2:30 UTC
    - cron: '30 2 * * 1-5'
    # 11:30 AM VN = 4:30 UTC
    - cron: '30 4 * * 1-5'
    # 1:30 PM VN  = 6:30 UTC
    - cron: '30 6 * * 1-5'
    # 2:30 PM VN  = 7:30 UTC
    - cron: '30 7 * * 1-5'
    # 4:00 PM VN  = 9:00 UTC (EOD - after market close)
    - cron: '0 9 * * 1-5'
  workflow_dispatch:

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install "sqlalchemy>=2.0" "psycopg[binary]" vnstock pytz --quiet
          python -c "from vnstock import Quote; print('vnstock OK')"

      - name: Run price update
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python update_eod_prices.py

      - name: Verify prices updated
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python verify_prices.py
