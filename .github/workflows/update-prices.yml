name: Update EOD Prices

on:
  schedule:
    # 4PM Vietnam = 9AM UTC, Monday-Friday
    - cron: '0 9 * * 1-5'
  workflow_dispatch:

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install "sqlalchemy>=2.0" "psycopg[binary]" vnstock pytz --quiet
          python -c "from vnstock import Quote; print('vnstock OK')"

      - name: Run price update
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python update_eod_prices.py

      - name: Verify prices updated
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python verify_prices.py
