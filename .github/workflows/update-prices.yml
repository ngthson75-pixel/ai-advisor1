name: Update EOD Prices

# v2 (2026-09-27): lấy giá theo bảng giá (~1-2 phút/lần thay vì 11-60 phút)
# -> quét được 6 lần/ngày mà vẫn trong 2.000 phút miễn phí của GitHub Actions.
# Sau MỖI lần cập nhật giá: định giá lại danh mục mẫu Lướt sóng AI.
# Lần 16:00 (EOD) chạy thêm Rescue Watch ngay sau khi giá cuối ngày đã về.
# v3.2 (2026-10-02): chạy tay có ô 'history_tickers' để nạp lịch sử nến cho mã bất kỳ (kiểm tra 24 -> 2).
# v3 (2026-10-01) — Giám sát danh mục VIP (Rescue Watch v2):
#   16:00  nạp nến ngày (update_price_history.py) -> Giám sát scope=eod (đủ mọi biến cố, gộp 1 tin/khách)
#   các lần trong phiên -> Giám sát scope=intraday (chỉ giảm >=5% / xuyên hỗ trợ >2%)
#   Gửi thật hay chỉ bản nháp được quyết định THEO TỪNG KHÁCH (signal_reviewer.py -> 24 -> 9), mặc định bản nháp.
#   CÔNG TẮC KHẨN: GitHub -> Settings -> Variables -> RESCUE_WATCH_MODE = admin  => dừng gửi MỌI khách (chỉ bản nháp).
on:
  schedule:
    # Giờ Việt Nam (UTC+7), thứ 2 - thứ 6
    - cron: '30 2 * * 1-5'   #  9:30 VN
    - cron: '30 3 * * 1-5'   # 10:30 VN
    - cron: '30 4 * * 1-5'   # 11:30 VN (hết phiên sáng)
    - cron: '30 6 * * 1-5'   # 13:30 VN
    - cron: '30 7 * * 1-5'   # 14:30 VN
    - cron: '0 9 * * 1-5'    # 16:00 VN (EOD) + Rescue Watch
  workflow_dispatch:
    inputs:
      run_eod_watch:
        description: 'Chạy cả lịch sử nến + Giám sát cuối ngày (chỉ chọn khi đã hết phiên)'
        type: boolean
        default: false
      history_tickers:
        description: 'Nạp lịch sử nến 1 năm cho mã bất kỳ (VD: MBB hoặc MBB,HPG) — để kiểm tra 24 → 2'
        type: string
        default: ''

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 25          # chặn lần chạy bất thường ăn hết phút Actions
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install "sqlalchemy>=2.0" "psycopg[binary]" pytz pandas --quiet && pip install --extra-index-url https://vnstocks.com/api/simple "vnstock==4.0.9" "vnai==2.6.2" --quiet
          python -c "from vnstock import Quote; print('vnstock OK')"

      - name: Run price update
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python update_eod_prices.py

      - name: Price history (nen ngay cho Giam sat danh muc - 16:00)
        if: github.event.schedule == '0 9 * * 1-5' || inputs.run_eod_watch
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python update_price_history.py

      - name: Nap lich su nen theo ma (chay tay)
        if: github.event_name == 'workflow_dispatch' && inputs.history_tickers != ''
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TICKERS: ${{ inputs.history_tickers }}
        run: python update_price_history.py $(echo "$TICKERS" | tr ',;' '  ' | tr '[:lower:]' '[:upper:]')

      - name: Verify prices updated
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python verify_prices.py

      - name: Model Portfolio (danh muc mau - moi lan cap nhat gia)
        continue-on-error: true
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_SECRET }}
        run: |
          curl -s --max-time 90 https://ai-advisor1-backend.onrender.com/health > /dev/null || true
          curl -sS --max-time 120 -X POST \
            -H "X-Admin-Key: $ADMIN_KEY" -H "Content-Type: application/json" -d '{}' \
            https://ai-advisor1-backend.onrender.com/api/admin/model-portfolio/run \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('success:', d.get('success'), d.get('error',''), '| NAV:', d.get('nav'), '| rebalanced:', d.get('rebalanced')); [print('  ', a) for a in d.get('actions',[])]; sys.exit(0 if d.get('success') else 1)"

      - name: Giam sat danh muc VIP - cuoi ngay (16:00)
        if: github.event.schedule == '0 9 * * 1-5' || inputs.run_eod_watch
        continue-on-error: true
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_SECRET }}
          MODE: ${{ vars.RESCUE_WATCH_MODE || 'live' }}
        run: |
          curl -s --max-time 90 https://ai-advisor1-backend.onrender.com/health > /dev/null || true
          curl -sS --max-time 180 -X POST \
            -H "X-Admin-Key: $ADMIN_KEY" -H "Content-Type: application/json" \
            -d "{\"mode\": \"$MODE\", \"scope\": \"eod\"}" \
            https://ai-advisor1-backend.onrender.com/api/admin/rescue-watch/run \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('success:', d.get('success'), d.get('error','')); [print(u['user'][:3]+'***', '| events:', u.get('event_types'), '| sent:', u['sent'], u.get('channels'), '| skipped:', u['skipped'], '| data warnings:', len(u['warnings'])) for u in d.get('users',[])]; sys.exit(0 if d.get('success') else 1)"

      - name: Giam sat danh muc VIP - trong phien
        if: github.event_name == 'schedule' && github.event.schedule != '0 9 * * 1-5'
        continue-on-error: true
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_SECRET }}
          MODE: ${{ vars.RESCUE_WATCH_MODE || 'live' }}
        run: |
          curl -sS --max-time 180 -X POST \
            -H "X-Admin-Key: $ADMIN_KEY" -H "Content-Type: application/json" \
            -d "{\"mode\": \"$MODE\", \"scope\": \"intraday\"}" \
            https://ai-advisor1-backend.onrender.com/api/admin/rescue-watch/run \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('success:', d.get('success'), d.get('error','')); [print(u['user'][:3]+'***', '| events:', u.get('event_types'), '| sent:', u['sent']) for u in d.get('users',[]) if u['events']]; sys.exit(0 if d.get('success') else 1)"
