name: Update EOD Prices

# v2 (2026-09-27): lấy giá theo bảng giá (~1-2 phút/lần thay vì 11-60 phút)
# -> quét được 6 lần/ngày mà vẫn trong 2.000 phút miễn phí của GitHub Actions.
# Sau MỖI lần cập nhật giá: định giá lại danh mục mẫu Lướt sóng AI.
# Lần 16:00 (EOD) chạy thêm Rescue Watch ngay sau khi giá cuối ngày đã về.
on:
  schedule:
    # Giờ Việt Nam (UTC+7), thứ 2 - thứ 6
    - cron: '30 2 * * 1-5'   #  9:30 VN
    - cron: '30 3 * * 1-5'   # 10:30 VN
    - cron: '30 4 * * 1-5'   # 11:30 VN (hết phiên sáng)
    - cron: '30 6 * * 1-5'   # 13:30 VN
    - cron: '30 7 * * 1-5'   # 14:30 VN
    - cron: '0 9 * * 1-5'    # 16:00 VN (EOD) + Rescue Watch
  workflow_dispatch:

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 25          # chặn lần chạy bất thường ăn hết phút Actions
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install "sqlalchemy>=2.0" "psycopg[binary]" pytz pandas --quiet && pip install --extra-index-url https://vnstocks.com/api/simple "vnstock==4.0.9" "vnai==2.6.2" --quiet
          python -c "from vnstock import Quote; print('vnstock OK')"

      - name: Run price update
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python update_eod_prices.py

      - name: Verify prices updated
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python verify_prices.py

      - name: Model Portfolio (danh muc mau - moi lan cap nhat gia)
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_SECRET }}
        run: |
          curl -s --max-time 90 https://ai-advisor1-backend.onrender.com/health > /dev/null || true
          curl -sS --max-time 120 -X POST \
            -H "X-Admin-Key: $ADMIN_KEY" -H "Content-Type: application/json" -d '{}' \
            https://ai-advisor1-backend.onrender.com/api/admin/model-portfolio/run \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('success:', d.get('success'), d.get('error',''), '| NAV:', d.get('nav'), '| rebalanced:', d.get('rebalanced')); [print('  ', a) for a in d.get('actions',[])]" || true

      - name: Rescue Watch (sau cap nhat EOD 16:00)
        if: github.event.schedule == '0 9 * * 1-5'
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_SECRET }}
          MODE: ${{ vars.RESCUE_WATCH_MODE || 'admin' }}
        run: |
          curl -s --max-time 90 https://ai-advisor1-backend.onrender.com/health > /dev/null || true
          curl -sS --max-time 180 -X POST \
            -H "X-Admin-Key: $ADMIN_KEY" -H "Content-Type: application/json" \
            -d "{\"mode\": \"$MODE\"}" \
            https://ai-advisor1-backend.onrender.com/api/admin/rescue-watch/run \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('success:', d.get('success'), d.get('error','')); [print(u['user'][:3]+'***', '| events:', u['events'], '| sent:', u['sent'], '| skipped:', u['skipped'], '| data warnings:', len(u['warnings'])) for u in d.get('users',[])]" || true
