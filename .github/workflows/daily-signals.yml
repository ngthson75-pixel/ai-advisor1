name: Daily SELL Signal Generation

on:
  schedule:
    # Runs at 11:00 AM UTC = 6:00 PM Vietnam (UTC+7)
    - cron: '0 11 * * *'
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  generate-sell-signals:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: 📦 Install dependencies
        run: |
          pip install --upgrade pip
          pip install vnstock pandas --break-system-packages
      
      - name: 🗄️ Setup database
        run: |
          # Run database migration
          python scripts/update_database.py
      
      - name: 🎯 Generate SELL signals
        run: |
          cd scripts
          python sell_signal_generator.py
      
      - name: 📊 Show summary
        if: always()
        run: |
          python -c "
          import sqlite3
          import os
          
          db_path = 'signals.db'
          if not os.path.exists(db_path):
              print('⚠️  Database not found')
              exit(0)
          
          conn = sqlite3.connect(db_path)
          cursor = conn.cursor()
          
          # Count today's SELL signals
          cursor.execute('SELECT COUNT(*) FROM signals WHERE action = \"SELL\" AND date = date(\"now\")')
          sell_today = cursor.fetchone()[0]
          
          # Count total SELL signals
          cursor.execute('SELECT COUNT(*) FROM signals WHERE action = \"SELL\"')
          sell_total = cursor.fetchone()[0]
          
          # Count active BUY signals
          cursor.execute('SELECT COUNT(*) FROM signals WHERE action = \"BUY\" AND signal_status IN (\"ACTIVE\", \"PARTIAL_SOLD\")')
          active_buy = cursor.fetchone()[0]
          
          print('📊 Summary:')
          print(f'  Active BUY signals: {active_buy}')
          print(f'  SELL signals created today: {sell_today}')
          print(f'  Total SELL signals: {sell_total}')
          
          conn.close()
          "
      
      - name: ✅ Done
        run: |
          echo "✅ SELL signal generation completed!"
          echo "⏰ Time: $(date)"
