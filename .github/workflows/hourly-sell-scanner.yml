name: Hourly SELL Signal Scanner - Backend API

on:
  schedule:
    # Vietnam trading hours: 9:00-15:00 (UTC+7)
    # Scan every hour during trading
    
    - cron: '0 2 * * 1-5'   # 9:00 AM Vietnam (Mon-Fri)
    - cron: '0 3 * * 1-5'   # 10:00 AM Vietnam
    - cron: '0 4 * * 1-5'   # 11:00 AM Vietnam
    - cron: '0 6 * * 1-5'   # 1:00 PM Vietnam (after lunch)
    - cron: '0 7 * * 1-5'   # 2:00 PM Vietnam
  
  workflow_dispatch:  # Manual trigger

env:
  API_URL: https://ai-advisor1-backend.onrender.com/api

jobs:
  scan-sell-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Shorter timeout for API calls
    
    steps:
      - name: Set timezone
        run: |
          echo "🌏 Current time (UTC): $(date)"
          echo "🌏 Vietnam time: $(TZ=Asia/Ho_Chi_Minh date)"
      
      - name: Wake backend (if sleeping)
        run: |
          echo "🔄 Waking up backend..."
          for i in {1..3}; do
            curl -s "${{ env.API_URL }}/signals" > /dev/null && break
            sleep 10
          done
      
      - name: Check backend health
        run: |
          echo "🏥 Checking backend health..."
          HEALTH=$(curl -s "${{ env.API_URL }}/../health")
          echo "Response: $HEALTH"
      
      - name: Get current signal count
        id: before
        run: |
          echo "📊 Getting current signal count..."
          RESPONSE=$(curl -s "${{ env.API_URL }}/signals")
          BEFORE=$(echo "$RESPONSE" | jq -r '.count // 0')
          echo "count=$BEFORE" >> $GITHUB_OUTPUT
          echo "Current total signals: $BEFORE"
      
      - name: Trigger SELL scanner on backend
        id: trigger
        run: |
          echo "🔍 Triggering SELL signal scanner on backend..."
          echo "⏰ Time: $(date +'%Y-%m-%d %H:%M:%S %Z')"
          echo "🌏 Vietnam: $(TZ=Asia/Ho_Chi_Minh date +'%Y-%m-%d %H:%M:%S')"
          
          RESPONSE=$(curl -s -X POST "${{ env.API_URL }}/scan-sell" \
            -H "Content-Type: application/json" \
            -d '{"days": 2}')
          
          echo "Response: $RESPONSE"
          
          # Check if successful
          if echo "$RESPONSE" | jq -e '.success' > /dev/null; then
            echo "✅ Scanner triggered successfully"
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ Failed to trigger scanner"
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi
      
      - name: Wait for scanner to complete
        if: steps.trigger.outputs.status == 'success'
        run: |
          echo "⏳ Waiting for scanner to complete (2-5 minutes)..."
          
          # Wait and check status every 30 seconds
          for i in {1..10}; do
            sleep 30
            
            # Check scan status
            STATUS=$(curl -s "${{ env.API_URL }}/scan-sell/status")
            echo "Check $i: $STATUS"
            
            # Get SELL count for today
            SELL_COUNT=$(echo "$STATUS" | jq -r '.total_sell_signals // 0')
            
            if [ "$SELL_COUNT" -gt 0 ]; then
              echo "✅ Found $SELL_COUNT SELL signals"
              break
            fi
          done
      
      - name: Get scan results
        id: after
        run: |
          echo "📊 Getting scan results..."
          
          # Get updated signal count
          RESPONSE=$(curl -s "${{ env.API_URL }}/signals")
          AFTER=$(echo "$RESPONSE" | jq -r '.count // 0')
          echo "count=$AFTER" >> $GITHUB_OUTPUT
          
          # Get SELL scan status
          SELL_STATUS=$(curl -s "${{ env.API_URL }}/scan-sell/status")
          SELL_COUNT=$(echo "$SELL_STATUS" | jq -r '.total_sell_signals // 0')
          echo "sell_count=$SELL_COUNT" >> $GITHUB_OUTPUT
          
          echo "Final total signals: $AFTER"
          echo "SELL signals today: $SELL_COUNT"
      
      - name: Display results
        run: |
          BEFORE=${{ steps.before.outputs.count }}
          AFTER=${{ steps.after.outputs.count }}
          SELL_COUNT=${{ steps.after.outputs.sell_count }}
          NEW=$((AFTER - BEFORE))
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 SCAN RESULTS"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Before:       $BEFORE signals"
          echo "After:        $AFTER signals"
          echo "New:          $NEW signals"
          echo "SELL today:   $SELL_COUNT signals"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          if [ $SELL_COUNT -gt 0 ]; then
            echo "✅ Generated $SELL_COUNT SELL signals today"
            
            # Show breakdown by reason
            SELL_STATUS=$(curl -s "${{ env.API_URL }}/scan-sell/status")
            echo ""
            echo "By reason:"
            echo "$SELL_STATUS" | jq -r '.by_reason | to_entries[] | "  \(.key): \(.value)"'
          else
            echo "ℹ️  No SELL signals (market conditions normal)"
          fi
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ SELL scanner failed!"
          echo "Time: $(date +'%Y-%m-%d %H:%M:%S %Z')"
          echo "Check backend logs for details"
