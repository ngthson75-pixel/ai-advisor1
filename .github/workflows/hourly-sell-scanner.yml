name: Hourly Sell Signal Scanner v6

on:
  schedule:
    # 9:30-15:30 giờ VN (2:30-8:30 UTC), T2-T6. GitHub hay chạy trễ: lượt nào rơi ngoài giờ sẽ tự thoát.
    - cron: '30 2,3,4,5,6,7,8 * * 1-5'
  workflow_dispatch:

concurrency:
  group: sell-scanner
  cancel-in-progress: false

jobs:
  scan-sell-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install psycopg2-binary python-dotenv pandas numpy sqlalchemy

      - name: Run Sell Scanner v6
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: ${{ secrets.DB_PORT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_TELEGRAM_CHAT_ID: ${{ secrets.ADMIN_TELEGRAM_CHAT_ID }}
          CI: 'true'
          GITHUB_ACTIONS: 'true'
          PYTHONUNBUFFERED: '1'
        run: python sell_signal_scanner_v6.py
