name: Hourly Sell Signal Scanner v5.3

on:
  schedule:
    # Runs every hour from 9:30-15:30 VN time (2:30-8:30 UTC)
    # Cron format: minute hour day month weekday
    - cron: '30 2,3,4,5,6,7,8 * * 1-5'
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  scan-sell-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install vnstock psycopg2-binary python-dotenv pandas numpy
      
      - name: Run Sell Scanner v5.3
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: ${{ secrets.DB_PORT }}
          CI: 'true'
          GITHUB_ACTIONS: 'true'
          PYTHONUNBUFFERED: '1'
        run: |
          echo "========================================"
          echo "🔍 SELL SIGNAL SCANNER v5.3"
          echo "========================================"
          echo "UTC Time: $(date '+%Y-%m-%d %H:%M:%S UTC')"
          echo "VN Time:  $(TZ='Asia/Ho_Chi_Minh' date '+%Y-%m-%d %H:%M:%S VN')"
          echo ""
          echo "EXIT CRITERIA:"
          echo "  1. Daily MACD + RSI>80 + Support → 100%"
          echo "  2. 4H MACD + Volume div → 50%"
          echo "  3. 1H Volume Climax → 100%"
          echo ""
          
          python sell_signal_scanner_v5_2.py
      
      - name: Summary
        if: always()
        run: |
          echo ""
          echo "========================================"
          echo "✅ Scan complete - check logs above"
          echo "========================================"
