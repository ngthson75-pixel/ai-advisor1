name: Hourly SELL Signal Scanner

on:
  schedule:
    # Run every hour during Vietnam trading hours
    # 9:05 AM - 3:05 PM VN = 2:05 AM - 8:05 AM UTC
    # Monday-Friday only
    - cron: '5 2-8 * * 1-5'
  
  # Allow manual trigger for testing
  workflow_dispatch:
    inputs:
      days:
        description: 'Look back N days'
        required: false
        default: '30'

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  scan-sell-signals:
    name: Scan SELL Signals
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install requests vnstock3 psycopg2-binary python-dotenv
      
      - name: Run SELL Scanner (Auto-confirm)
        run: |
          echo "========================================"
          echo "🔍 SELL SIGNAL SCANNER - AUTOMATED"
          echo "========================================"
          echo "UTC Time: $(date '+%Y-%m-%d %H:%M:%S UTC')"
          echo "VN Time:  $(TZ='Asia/Ho_Chi_Minh' date '+%Y-%m-%d %H:%M:%S VN')"
          echo ""
          
          # Auto-confirm by piping "y"
          echo "y" | python sell_signal_scanner_v5.2.py
        env:
          CI: 'true'
          GITHUB_ACTIONS: 'true'
          PYTHONUNBUFFERED: '1'
      
      - name: Summary
        if: always()
        run: |
          echo ""
          echo "✅ Scan complete - check logs above for results"
