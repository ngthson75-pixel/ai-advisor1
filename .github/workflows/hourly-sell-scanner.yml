name: Hourly SELL Signal Scanner

on:
  schedule:
    # Run every 2 hours at :05 (e.g., 1:05, 2:05, 3:05...)
    # Format: minute hour day month weekday
    - cron: '5 */2 * * *'
  
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      days:
        description: 'Look back N days for BUY signals'
        required: false
        default: '7'
      delay:
        description: 'Delay between requests (seconds)'
        required: false
        default: '2.0'

jobs:
  scan-sell-signals:
    name: Scan for SELL Signals
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: 🔍 Start SELL Scanner
        run: |
          echo "============================================================"
          echo "🔍 SELL SIGNAL SCANNER - HOURLY RUN"
          echo "============================================================"
          echo "Time: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "API: $API_URL"
          echo ""
        env:
          API_URL: https://ai-advisor1-backend.onrender.com/api
      
      # 1. Wake backend (may be sleeping)
      - name: ⏰ Wake Backend
        run: |
          echo "Waking backend..."
          for i in {1..3}; do
            echo "  Attempt $i/3..."
            curl -s "$API_URL/../health" > /dev/null && break
            sleep 10
          done
          echo "✅ Backend awake"
        env:
          API_URL: https://ai-advisor1-backend.onrender.com/api
      
      # 2. Check health
      - name: 🏥 Health Check
        run: |
          echo "Checking backend health..."
          HEALTH=$(curl -s "$API_URL/../health")
          echo "Response: $HEALTH"
          
          if echo "$HEALTH" | grep -q '"status":"healthy"'; then
            echo "✅ Backend healthy"
          else
            echo "⚠️  Backend may not be fully ready"
          fi
        env:
          API_URL: https://ai-advisor1-backend.onrender.com/api
      
      # 3. Get current SELL count (before scan)
      - name: 📊 Before Scan
        id: before
        run: |
          echo "Getting current SELL signal count..."
          
          BEFORE=$(curl -s "$API_URL/scan-sell/status" | grep -o '"total_sell_signals":[0-9]*' | grep -o '[0-9]*')
          
          if [ -z "$BEFORE" ]; then
            BEFORE=0
          fi
          
          echo "before_count=$BEFORE" >> $GITHUB_OUTPUT
          echo "📊 Current SELL signals: $BEFORE"
        env:
          API_URL: https://ai-advisor1-backend.onrender.com/api
      
      # 4. Trigger SELL scanner
      - name: 🚀 Trigger Scanner
        run: |
          echo "Triggering SELL scanner..."
          
          DAYS="${{ github.event.inputs.days || '7' }}"
          DELAY="${{ github.event.inputs.delay || '2.0' }}"
          
          echo "  Days: $DAYS"
          echo "  Delay: $DELAY s"
          
          RESPONSE=$(curl -s -X POST "$API_URL/scan-sell" \
            -H "Content-Type: application/json" \
            -d "{\"days\": $DAYS, \"delay\": $DELAY}")
          
          echo "Response: $RESPONSE"
          
          if echo "$RESPONSE" | grep -q '"success":true'; then
            echo "✅ Scanner triggered successfully"
          else
            echo "⚠️  Scanner may not have started properly"
          fi
        env:
          API_URL: https://ai-advisor1-backend.onrender.com/api
      
      # 5. Monitor progress (check every 30s for up to 30 min)
      - name: ⏱️  Monitor Scan Progress
        run: |
          echo "Monitoring scan progress..."
          echo "Will check every 30s for up to 30 minutes"
          echo ""
          
          BEFORE_COUNT=${{ steps.before.outputs.before_count }}
          
          for i in {1..60}; do
            sleep 30
            
            # Get current count
            CURRENT=$(curl -s "$API_URL/scan-sell/status" | grep -o '"total_sell_signals":[0-9]*' | grep -o '[0-9]*')
            
            if [ -z "$CURRENT" ]; then
              CURRENT=$BEFORE_COUNT
            fi
            
            # Progress indicator every 2 minutes
            if [ $((i % 4)) -eq 0 ]; then
              ELAPSED=$((i / 2))
              echo "Check $ELAPSED/30 min - SELL signals: $CURRENT (was $BEFORE_COUNT)"
            fi
            
            # If count increased significantly, scanner likely done
            DIFF=$((CURRENT - BEFORE_COUNT))
            if [ $DIFF -ge 3 ]; then
              echo "✅ New signals detected: +$DIFF"
              break
            fi
          done
          
          echo ""
          echo "Monitoring complete"
        env:
          API_URL: https://ai-advisor1-backend.onrender.com/api
      
      # 6. Get results
      - name: 📊 Scan Results
        run: |
          echo "============================================================"
          echo "📊 SCAN RESULTS"
          echo "============================================================"
          
          BEFORE=${{ steps.before.outputs.before_count }}
          
          STATUS=$(curl -s "$API_URL/scan-sell/status")
          echo "Status: $STATUS"
          
          AFTER=$(echo "$STATUS" | grep -o '"total_sell_signals":[0-9]*' | grep -o '[0-9]*')
          
          if [ -z "$AFTER" ]; then
            AFTER=$BEFORE
          fi
          
          STOP_LOSS=$(echo "$STATUS" | grep -o '"stop_loss":[0-9]*' | grep -o '[0-9]*')
          TAKE_PROFIT=$(echo "$STATUS" | grep -o '"take_profit":[0-9]*' | grep -o '[0-9]*')
          
          [ -z "$STOP_LOSS" ] && STOP_LOSS=0
          [ -z "$TAKE_PROFIT" ] && TAKE_PROFIT=0
          
          echo ""
          echo "Before:  $BEFORE signals"
          echo "After:   $AFTER signals"
          echo "New:     $((AFTER - BEFORE)) signals"
          echo ""
          echo "Breakdown:"
          echo "  🔴 Stop Loss:   $STOP_LOSS"
          echo "  🟢 Take Profit: $TAKE_PROFIT"
          echo ""
          echo "============================================================"
        env:
          API_URL: https://ai-advisor1-backend.onrender.com/api
      
      # 7. Summary
      - name: ✅ Complete
        run: |
          echo "✅ Hourly SELL signal scan complete"
          echo "Time: $(date '+%Y-%m-%d %H:%M:%S')"
          echo ""
          echo "Next run: Next hour at :05"
