name: Daily EOD Signal Scanner

on:
  schedule:
    - cron: '30 8 * * *'  # 15:30 Vietnam time (UTC+7)
  workflow_dispatch:
  push:
    branches: [staging, main]
    paths:
      - '.github/workflows/daily-scan.yml'
      - 'scripts/daily_signal_scanner_eod.py'

jobs:
  scan-signals:
    runs-on: ubuntu-latest
    
    steps:
      - name: Display scan info
        run: |
          echo "🔍 Starting Daily EOD Signal Scanner"
          echo "Backend: https://ai-advisor1-staging.onrender.com"
          echo "Time: $(date)"
          echo "Expected: 136 signals from 343 stocks"
      
      - name: Wake backend
        run: |
          echo "⏰ Waking backend (if sleeping)..."
          curl -f https://ai-advisor1-staging.onrender.com/health || sleep 30
          curl -f https://ai-advisor1-staging.onrender.com/health
          echo "✅ Backend is awake"
      
      - name: Trigger signal scanner
        run: |
          echo "🚀 Triggering scanner..."
          response=$(curl -s -X POST https://ai-advisor1-staging.onrender.com/api/scan -w "\nHTTP_CODE:%{http_code}")
          echo "$response"
          
          http_code=$(echo "$response" | grep "HTTP_CODE" | cut -d':' -f2)
          
          if [ "$http_code" = "202" ]; then
            echo "✅ Scanner started successfully"
          else
            echo "❌ Scanner failed to start (HTTP $http_code)"
            exit 1
          fi
      
      - name: Wait for scanner to complete
        run: |
          echo "⏳ Waiting for scanner to complete (343 stocks, ~25 minutes)..."
          
          for i in {1..30}; do
            sleep 60
            
            status=$(curl -s https://ai-advisor1-staging.onrender.com/api/scan/status)
            echo "[$i/30] Status check: $status"
            
            signals=$(echo "$status" | grep -o '"signals_count":[0-9]*' | cut -d':' -f2)
            scan_status=$(echo "$status" | grep -o '"status":"[^"]*' | cut -d'"' -f4)
            
            if [ ! -z "$signals" ] && [ "$signals" -gt 0 ]; then
              echo "✅ Scanner complete! Found $signals signals"
              break
            fi
            
            echo "   Waiting 60 seconds... (Total: $((i)) minutes)"
          done
      
      - name: Verify signals generated
        run: |
          echo "📊 Verifying signals..."
          
          status=$(curl -s https://ai-advisor1-staging.onrender.com/api/scan/status)
          echo "Scan status: $status"
          
          signals=$(echo "$status" | grep -o '"signals_count":[0-9]*' | cut -d':' -f2)
          
          if [ -z "$signals" ]; then
            echo "⚠️ Could not parse signals count"
            signals=0
          fi
          
          echo ""
          echo "========================================"
          echo "✅ SCAN COMPLETE"
          echo "========================================"
          echo "Signals generated: $signals"
          echo "Expected: ~136 signals"
          echo ""
          
          if [ "$signals" -gt 0 ]; then
            echo "✅ SUCCESS: Found $signals signals!"
          else
            echo "⚠️ WARNING: No signals found (may be database reset issue)"
          fi
      
      - name: Display top signals
        run: |
          echo "⭐ Fetching top 5 signals..."
          curl -s https://ai-advisor1-staging.onrender.com/api/signals | head -100
      
      - name: Send notification on failure
        if: failure()
        run: |
          echo "❌ Workflow failed!"
          echo "Check logs above for errors"
          echo "Backend: https://ai-advisor1-staging.onrender.com"