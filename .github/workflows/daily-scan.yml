name: Daily EOD Signal Scanner

on:
  schedule:
    # Runs at 08:30 UTC = 15:30 Vietnam time (UTC+7)
    - cron: '30 8 * * *'
  
  workflow_dispatch:  # Enables manual trigger button
  
  push:
    branches: [staging, main]
    paths:
      - '.github/workflows/daily-scan.yml'
      - 'scripts/daily_signal_scanner_eod.py'

jobs:
  scan-signals:
    runs-on: ubuntu-latest
    
    steps:
      - name: Display scan info
        run: |
          echo "🔍 Starting Daily EOD Signal Scanner"
          echo "Backend: https://ai-advisor1-staging.onrender.com"
          echo "Time: $(date)"
      
      - name: Wake backend (if sleeping)
        run: |
          echo "Waking backend..."
          curl -f https://ai-advisor1-staging.onrender.com/health || sleep 30
          curl -f https://ai-advisor1-staging.onrender.com/health
      
      - name: Trigger signal scanner
        run: |
          echo "Triggering scanner..."
          response=$(curl -X POST https://ai-advisor1-staging.onrender.com/api/scan -w "\nHTTP_CODE:%{http_code}")
          echo "$response"
          
          # Check if 202 Accepted
          if echo "$response" | grep -q "HTTP_CODE:202"; then
            echo "✅ Scanner started successfully"
          else
            echo "❌ Scanner failed to start"
            exit 1
          fi
      
      - name: Wait for scanner to complete
        run: |
          echo "⏳ Waiting 12 minutes for scanner (343 stocks)..."
          sleep 720
      
      - name: Check scan status
        run: |
          echo "Checking scan status..."
          status=$(curl -s https://ai-advisor1-staging.onrender.com/api/scan/status)
          echo "$status"
          
          # Parse JSON
          signals_count=$(echo "$status" | grep -o '"signals_count":[0-9]*' | cut -d':' -f2)
          echo "📊 Signals generated: $signals_count"
      
      - name: Verify signals
        run: |
          echo "Verifying signals..."
          curl -s https://ai-advisor1-staging.onrender.com/api/signals | head -20