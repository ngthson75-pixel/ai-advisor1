name: Daily Signal Scanner

on:
  schedule:
    # Runs at 9:00 AM Vietnam time (2:00 AM UTC) every day
    - cron: '0 2 * * *'
  
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  scan-signals:
    runs-on: ubuntu-latest
    
    steps:
      - name: Set environment variables
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          else
            ENV="production"
          fi
          
          if [ "$ENV" = "production" ]; then
            echo "API_URL=https://ai-advisor1-backend.onrender.com/api" >> $GITHUB_ENV
            echo "ENV_NAME=PRODUCTION" >> $GITHUB_ENV
          else
            echo "API_URL=https://ai-advisor1-staging.onrender.com/api" >> $GITHUB_ENV
            echo "ENV_NAME=STAGING" >> $GITHUB_ENV
          fi
      
      - name: Start scan
        run: |
          echo "🚀 Starting Daily Signal Scanner - ${{ env.ENV_NAME }}"
          echo "⏰ Time: $(date)"
          echo ""
          
          # Wake up backend (Render free tier may be sleeping)
          echo "⏰ Waking up backend..."
          for i in {1..3}; do
            if curl -s "${{ env.API_URL }}/signals" > /dev/null 2>&1; then
              echo "✅ Backend is awake"
              break
            fi
            echo "   Attempt $i/3..."
            sleep 10
          done
          echo ""
          
          # Check backend health
          echo "🏥 Checking backend health..."
          HEALTH=$(curl -s "${{ env.API_URL }}/../health" || echo '{"status":"error"}')
          echo "$HEALTH"
          
          if echo "$HEALTH" | grep -q '"status":"healthy"'; then
            echo "✅ Backend is healthy"
          else
            echo "⚠️ Backend health check failed, but continuing..."
          fi
          echo ""
          
          # Get current signal count
          echo "📊 Current signals before scan:"
          BEFORE=$(curl -s "${{ env.API_URL }}/signals" | grep -o '"count":[0-9]*' | grep -o '[0-9]*' || echo "0")
          echo "   Count: $BEFORE"
          echo ""
          
          # Trigger scanner
          echo "🔍 Triggering signal scanner..."
          SCAN_RESPONSE=$(curl -s -X POST "${{ env.API_URL }}/scan" -H "Content-Type: application/json")
          echo "$SCAN_RESPONSE"
          echo ""
          
          # Check if scan started
          if echo "$SCAN_RESPONSE" | grep -q '"success":true'; then
            echo "✅ Scanner triggered successfully"
            
            # Extract expected duration
            if echo "$SCAN_RESPONSE" | grep -q "20-25 minutes"; then
              echo "⏱️ Expected duration: 20-25 minutes"
              WAIT_TIME=25
            else
              WAIT_TIME=20
            fi
          else
            echo "❌ Failed to trigger scanner"
            exit 1
          fi
          echo ""
          
          # Monitor progress - INCREASED TO 45 MINUTES (90 iterations)
          echo "⏳ Monitoring scan progress for up to 45 minutes..."
          echo "   (Scanner typically takes 20-25 minutes)"
          echo ""
          
          for i in {1..90}; do
            sleep 30  # Check every 30 seconds
            
            CURRENT=$(curl -s "${{ env.API_URL }}/signals" | grep -o '"count":[0-9]*' | grep -o '[0-9]*' || echo "0")
            
            # Show progress every 2 minutes (every 4 iterations)
            if [ $((i % 4)) -eq 0 ]; then
              ELAPSED=$((i / 2))
              echo "   Check $((i / 2))/45 minutes - Signals: $CURRENT"
            fi
            
            # Check if scan completed (signal count increased)
            if [ "$CURRENT" -gt "$BEFORE" ]; then
              echo ""
              echo "✅ Scan completed! Signal count increased from $BEFORE to $CURRENT"
              break
            fi
            
            # If we're past expected time and no change, something's wrong
            if [ $i -gt 50 ] && [ "$CURRENT" -eq "$BEFORE" ]; then
              echo ""
              echo "⚠️ No progress after 25 minutes - checking scan status..."
              SCAN_STATUS=$(curl -s "${{ env.API_URL }}/scan/status" || echo '{}')
              echo "$SCAN_STATUS"
              
              # If status shows complete or error, break
              if echo "$SCAN_STATUS" | grep -qE '"status":"(complete|error|failed)"'; then
                echo "ℹ️ Scan status indicates completion or failure"
                break
              fi
            fi
          done
          echo ""
          
          # Final check
          AFTER=$(curl -s "${{ env.API_URL }}/signals" | grep -o '"count":[0-9]*' | grep -o '[0-9]*' || echo "0")
          
          if [ "$AFTER" -eq "$BEFORE" ]; then
            echo "⚠️ Scanner did not complete in 45 minutes or no new signals generated"
            echo "   This may be normal if market conditions don't generate signals"
          else
            echo "🎉 Scan successful!"
          fi
          echo ""
      
      - name: Get results
        run: |
          echo "📊 FINAL RESULTS"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          
          # Get signals with details
          RESPONSE=$(curl -s "${{ env.API_URL }}/signals")
          
          # Extract count
          COUNT=$(echo "$RESPONSE" | grep -o '"count":[0-9]*' | grep -o '[0-9]*' || echo "0")
          echo "✅ Total signals: $COUNT"
          echo ""
          
          # Try to extract strategy breakdown (if available)
          PULLBACK=$(echo "$RESPONSE" | grep -o '"strategy":"PULLBACK"' | wc -l || echo "?")
          EMA_CROSS=$(echo "$RESPONSE" | grep -o '"strategy":"EMA_CROSS"' | wc -l || echo "?")
          
          if [ "$PULLBACK" != "?" ] && [ "$EMA_CROSS" != "?" ]; then
            echo "📈 Strategy Breakdown:"
            echo "   PULLBACK: $PULLBACK"
            echo "   EMA_CROSS: $EMA_CROSS"
            echo ""
          fi
          
          # Show top 5 signals if available
          if [ "$COUNT" -gt 0 ]; then
            echo "🏆 Top 5 Signals (by strength):"
            echo "$RESPONSE" | grep -o '"ticker":"[^"]*"' | head -5 | sed 's/"ticker":"\([^"]*\)"/   • \1/' || echo "   (Unable to parse top signals)"
            echo ""
          fi
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎯 DAILY SCAN COMPLETE"
          echo "⏰ Completed at: $(date)"
          echo ""
          echo "🌐 View signals at: https://ai-advisor.vn"
          echo ""
