name: Daily Signal Scanner

on:
  schedule:
    # Chạy vào 6:00 PM Vietnam time (11:00 AM UTC) - CHỈ T2-T6
    # Cron format: minute hour day month weekday
    # weekday: 1-5 = Monday-Friday
    - cron: '0 11 * * 1-5'
  
  workflow_dispatch:  # Manual trigger

jobs:
  scan-buy-signals:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests vnstock --break-system-packages
      
      - name: Check if trading day
        id: check_trading_day
        run: |
          echo "🗓️ Checking if today is a trading day..."
          
          # Download holiday calendar
          curl -s https://raw.githubusercontent.com/${{ github.repository }}/main/vietnam_holidays.json > vietnam_holidays.json || echo '{"holidays":{}}' > vietnam_holidays.json
          
          # Download check script
          curl -s https://raw.githubusercontent.com/${{ github.repository }}/main/check_trading_day.py > check_trading_day.py
          
          # Run check
          if python check_trading_day.py --quiet; then
            echo "trading_day=true" >> $GITHUB_OUTPUT
            echo "✅ Today is a trading day - Proceeding with scan"
          else
            echo "trading_day=false" >> $GITHUB_OUTPUT
            echo "❌ Today is NOT a trading day - Skipping scan"
          fi
      
      - name: Wake backend (if sleeping)
        if: steps.check_trading_day.outputs.trading_day == 'true'
        run: |
          echo "⏰ Waking up backend..."
          curl -f https://ai-advisor1-backend.onrender.com/health || true
          sleep 5
      
      - name: Check backend health
        if: steps.check_trading_day.outputs.trading_day == 'true'
        run: |
          echo "🏥 Checking backend health..."
          for i in {1..3}; do
            if curl -f https://ai-advisor1-backend.onrender.com/health; then
              echo "✅ Backend is healthy"
              exit 0
            fi
            echo "⚠️ Attempt $i failed, retrying..."
            sleep 10
          done
          echo "❌ Backend health check failed"
          exit 1
      
      - name: Get current signal count
        if: steps.check_trading_day.outputs.trading_day == 'true'
        id: before_scan
        run: |
          echo "📊 Getting signal count before scan..."
          COUNT=$(curl -s "https://ai-advisor1-backend.onrender.com/api/signals" | jq -r '.count // 0')
          echo "current_count=$COUNT" >> $GITHUB_OUTPUT
          echo "Current signals: $COUNT"
      
      - name: Run BUY signal scanner
        if: steps.check_trading_day.outputs.trading_day == 'true'
        run: |
          echo "🔍 Starting BUY signal scanner..."
          RESPONSE=$(curl -X POST https://ai-advisor1-backend.onrender.com/api/scan \
            -H "Content-Type: application/json" \
            -w "\n%{http_code}" \
            -s)
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"
          
          if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 202 ]; then
            echo "✅ Scan completed successfully"
          else
            echo "❌ Scan failed with status $HTTP_CODE"
            exit 1
          fi

      - name: Get final signal count
        if: steps.check_trading_day.outputs.trading_day == 'true'
        id: after_scan
        run: |
          echo "📊 Getting final signal count..."
          sleep 3
          COUNT=$(curl -s "https://ai-advisor1-backend.onrender.com/api/signals" | jq -r '.count // 0')
          echo "final_count=$COUNT" >> $GITHUB_OUTPUT
          echo "Final signals: $COUNT"
      
      - name: Calculate new signals
        if: steps.check_trading_day.outputs.trading_day == 'true'
        run: |
          BEFORE=${{ steps.before_scan.outputs.current_count }}
          AFTER=${{ steps.after_scan.outputs.final_count }}
          NEW=$((AFTER - BEFORE))
          
          echo "=================================="
          echo "📊 SCAN RESULTS"
          echo "=================================="
          echo "Before: $BEFORE signals"
          echo "After:  $AFTER signals"
          echo "New:    $NEW signals"
          echo "=================================="
      
      - name: Notify on failure
        if: failure() && steps.check_trading_day.outputs.trading_day == 'true'
        run: |
          echo "❌ Daily scan failed!"
          echo "Check logs for details"
