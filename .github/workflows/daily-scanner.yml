name: Daily Signal Scanner

# Run daily at 15:30 Vietnam time (08:30 UTC)
# Also allow manual triggering
on:
  schedule:
    # 08:30 UTC = 15:30 Vietnam (UTC+7)
    - cron: '30 8 * * *'
  
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to scan'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  scan-signals:
    name: Scan 343 Stocks for Signals
    runs-on: ubuntu-latest
    timeout-minutes: 45  # Scanner takes 25-30 min, allow buffer
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Determine backend URL
        id: backend
        run: |
          if [ "${{ github.event.inputs.environment }}" == "staging" ]; then
            echo "url=https://ai-advisor1-staging.onrender.com" >> $GITHUB_OUTPUT
            echo "env_name=Staging" >> $GITHUB_OUTPUT
          else
            echo "url=https://ai-advisor1-backend.onrender.com" >> $GITHUB_OUTPUT
            echo "env_name=Production" >> $GITHUB_OUTPUT
          fi
      
      - name: Wake up backend (Render free tier)
        if: github.event.inputs.environment == 'staging'
        run: |
          echo "⏰ Waking up staging backend..."
          curl -f -s -o /dev/null "${{ steps.backend.outputs.url }}/health" || true
          sleep 10
      
      - name: Check backend health
        id: health
        run: |
          echo "🔍 Checking ${{ steps.backend.outputs.env_name }} backend health..."
          
          RESPONSE=$(curl -s -w "\n%{http_code}" "${{ steps.backend.outputs.url }}/health")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Backend not healthy!"
            exit 1
          fi
          
          echo "✅ Backend is healthy"
      
      - name: Trigger signal scanner
        id: trigger
        run: |
          echo "🚀 Triggering scanner on ${{ steps.backend.outputs.env_name }}..."
          echo "Backend: ${{ steps.backend.outputs.url }}"
          echo "Expected time: 25-30 minutes"
          echo "Scanning: 343 stocks"
          
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${{ steps.backend.outputs.url }}/api/scan")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"
          
          if [ "$HTTP_CODE" != "202" ]; then
            echo "❌ Failed to trigger scanner!"
            exit 1
          fi
          
          echo "✅ Scanner triggered successfully"
          echo "response=$BODY" >> $GITHUB_OUTPUT
      
      - name: Monitor scanner progress
        id: monitor
        run: |
          echo "⏰ Monitoring scanner progress..."
          echo "Will check every 2 minutes for 30 minutes"
          
          MAX_ATTEMPTS=15  # 15 attempts x 2 min = 30 min
          ATTEMPT=1
          
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Check #$ATTEMPT of $MAX_ATTEMPTS ($(date '+%H:%M:%S'))"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            
            # Get scan status
            RESPONSE=$(curl -s "${{ steps.backend.outputs.url }}/api/scan/status")
            echo "Status response: $RESPONSE"
            
            # Parse JSON (basic parsing without jq)
            SIGNALS_COUNT=$(echo "$RESPONSE" | grep -o '"signals_count":[0-9]*' | grep -o '[0-9]*' || echo "0")
            STATUS=$(echo "$RESPONSE" | grep -o '"status":"[^"]*"' | cut -d'"' -f4 || echo "unknown")
            
            echo "Signals found today: $SIGNALS_COUNT"
            echo "Status: $STATUS"
            
            # Check if complete (>100 signals usually means scanner finished)
            if [ "$SIGNALS_COUNT" -gt 100 ]; then
              echo ""
              echo "🎉 Scanner complete! Found $SIGNALS_COUNT signals!"
              exit 0
            fi
            
            # Check if explicitly complete
            if [ "$STATUS" == "complete" ]; then
              echo ""
              echo "✅ Scanner status: complete"
              exit 0
            fi
            
            # Wait 2 minutes before next check
            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              echo "⏳ Waiting 2 minutes before next check..."
              sleep 120
            fi
            
            ATTEMPT=$((ATTEMPT + 1))
          done
          
          echo ""
          echo "⚠️ Scanner did not complete in 30 minutes"
          echo "This may be normal if scanning many stocks"
          echo "Check manually: ${{ steps.backend.outputs.url }}/api/scan/status"
      
      - name: Get final results
        if: always()
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 FINAL RESULTS"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # Get final status
          RESPONSE=$(curl -s "${{ steps.backend.outputs.url }}/api/scan/status")
          echo "$RESPONSE"
          
          # Get signals count
          SIGNALS_RESPONSE=$(curl -s "${{ steps.backend.outputs.url }}/api/signals")
          TOTAL_SIGNALS=$(echo "$SIGNALS_RESPONSE" | grep -o '"count":[0-9]*' | grep -o '[0-9]*' || echo "0")
          
          echo ""
          echo "Total signals in database: $TOTAL_SIGNALS"
          echo ""
          echo "✅ Daily scanner workflow complete"
          echo "Environment: ${{ steps.backend.outputs.env_name }}"
          echo "Backend: ${{ steps.backend.outputs.url }}"
          echo "Time: $(date '+%Y-%m-%d %H:%M:%S UTC')"
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Scanner workflow FAILED!"
          echo "Please check:"
          echo "  1. Backend health: ${{ steps.backend.outputs.url }}/health"
          echo "  2. Scan status: ${{ steps.backend.outputs.url }}/api/scan/status"
          echo "  3. Workflow logs above"
          
          # You can add Telegram/email notification here if configured
          # Example: curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" ...
